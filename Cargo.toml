[package]
name = "lsmd"
version = "0.8.0"
edition = "2024"
description = "A terminal-friendly Markdown (.md) reader built for speed and easy navigation in large projects"
repository = "https://github.com/sanford/lsmd"
license = "GPL-3.0-or-later"
readme = "README.md"
keywords = ["markdown", "reader", "terminal", "tui", "preview"]
categories = ["command-line-utilities", "text-processing"]

[dependencies]
# Only to turn on use-dev-tty: without it, macOS can't read keys from the
# terminal when the document comes in on stdin. Keep in step with ratatui's.
crossterm = { version = "0.29.0", features = ["use-dev-tty"] }
clap = { version = "4.6.7", features = ["derive"] }
# --completions and --man.
clap_complete = "4.6.11"
clap_mangen = "0.3.3"
comrak = { version = "0.55.0", default-features = false }
ignore = "0.4.33"
nucleo-matcher = "0.3.1"
ratatui = "0.30.2"
syntect = { version = "5.3.0", default-features = false, features = ["parsing", "regex-fancy", "dump-load"] }
terminal-colorsaurus = "1.0.3"
two-face = { version = "0.5.2", default-features = false, features = ["syntect-fancy"] }
unicode-segmentation = "1.13.3"
unicode-width = "0.2.2"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
notify-debouncer-mini = "0.7.0"
toml = "1.1.6"
# Pinned: new and single-maintainer, so updates get read before they land.
omarchy-themes = "=0.1.0"
# Mermaid diagrams: laid out as SVG, drawn to pixels by resvg (the version
# mermaid-rs-renderer uses), and shown however the terminal can draw pictures.
# Pinned: early and single-maintainer, like omarchy-themes.
mermaid-rs-renderer = { version = "=0.3.1", default-features = false }
resvg = { version = "0.47.0", default-features = false, features = ["text", "system-fonts", "memmap-fonts"] }
ratatui-image = { version = "11.1.0", default-features = false, features = ["crossterm"] }
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "gif", "webp"] }
base64 = "0.22"

[dev-dependencies]
insta = "1.48.0"

[target."cfg(unix)".dependencies]
# Ctrl-Z: stopping lsmd the way the shell would.
libc = "0.2.189"

name: CI

# Windows only; macOS and Linux are tested by hand before each release.
#
# Pushes only, never pull requests: the job runs on a self-hosted runner, and
# this repo is public, so code from forks must never reach it. (Pushes to a
# fork run in the fork's own Actions, without our runner.)
on:
  push:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  # Runs the owners start (a push, a manual run, a re-run) go straight
  # through. Anyone else's wait here, on a GitHub-hosted runner, until an
  # owner approves them in the `approval` environment. The owners' accounts
  # are the TRUSTED_ACTORS repository variable, a JSON list; without it,
  # every run waits.
  approve:
    if: ${{ !contains(fromJSON(vars.TRUSTED_ACTORS || '[]'), github.triggering_actor) }}
    runs-on: ubuntu-latest
    environment: approval
    steps:
      - run: echo "Approved for ${{ github.triggering_actor }}"

  windows:
    needs: approve
    if: ${{ !cancelled() && (needs.approve.result == 'success' || needs.approve.result == 'skipped') }}
    runs-on: [self-hosted, Windows, X64]
    # The toolchain is installed machine-wide, in the folder named by the
    # RUST_DIR secret (a secret so the logs don't show the machine's layout),
    # so the runner service needs no environment of its own.
    env:
      RUSTUP_HOME: ${{ secrets.RUST_DIR }}\rustup
      CARGO_HOME: ${{ secrets.RUST_DIR }}\cargo
    defaults:
      run:
        shell: pwsh
    steps:
      - run: Add-Content $env:GITHUB_PATH "$env:CARGO_HOME\bin"
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - run: cargo test --locked --release
      - run: cargo clippy --locked --release --all-targets -- -D warnings
      # Neither step above leaves a lsmd.exe behind; tests build their own binaries.
      - run: cargo build --locked --release
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
        with:
          name: lsmd-windows-x64
          path: target/release/lsmd.exe
          if-no-files-found: error
